[project]
name = "fastapi-prompt-experiment-admin"
version = "0.1.0"
description = "Drop-in FastAPI admin for prompt profiles, experiment runs, diffs, and runtime promotions."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PromptAdmin contributors" }]
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.111",
  "jinja2>=3.1",
  "pydantic>=2.7",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27",
  "pytest>=8.2",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fastapi_prompt_experiment_admin"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
